<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i dont know</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 70%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding: 12px 16px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
            color: white;
            font-size: 16px;
        }

        .logo-text h1 {
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text p {
            font-size: 11px;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-box {
            position: relative;
            width: 150px;
            transition: width 0.3s ease;
        }

        .search-box:focus-within {
            width: 210px;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 13px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 34px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid #334155;
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 12px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .status-banner {
            margin-bottom: 16px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            color: #cbd5e1;
            font-size: 12px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .status-banner.hidden {
            display: none;
        }

        .status-banner button {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title i {
            color: #fbbf24;
        }

        .game-count {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
        }

        /* Responsive Grid layout */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 16px;
        }

        @media (min-width: 480px) {
            .game-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 768px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .game-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .game-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-3px);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.2);
        }

        .game-thumb {
            width: 100%;
            height: 130px;
            border-radius: 10px;
            overflow: hidden;
            background: #0f172a;
            margin-bottom: 10px;
            position: relative;
        }

        .game-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }

        .game-card:hover .game-thumb img {
            transform: scale(1.05);
        }

        .game-name {
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-desc {
            font-size: 11px;
            color: #94a3b8;
            line-height: 1.4;
            margin-bottom: 12px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .game-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            padding: 8px 12px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            cursor: pointer;
        }

        .game-btn:hover {
            background: #4f46e5;
        }

        .game-btn:active {
            transform: scale(0.97);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            display: none;
        }

        .empty-state.show {
            display: block;
        }

        .empty-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 18px;
        }

        footer {
            margin-top: auto;
            background: rgba(30, 41, 59, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 16px;
            text-align: center;
            font-size: 11px;
            color: #64748b;
        }

        /* Skeleton loading animation */
        .skeleton {
            background: #1e293b;
            border-radius: 14px;
            padding: 12px;
            animation: pulse 1.5s infinite;
        }
        .skeleton-thumb { width: 100%; height: 130px; background: #334155; border-radius: 10px; margin-bottom: 10px; }
        .skeleton-line { height: 12px; background: #334155; border-radius: 6px; margin-bottom: 8px; }
        .skeleton-line.short { width: 60%; }
        .skeleton-btn { height: 32px; background: #334155; border-radius: 10px; }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-container">
            <div class="logo-area">
                <div class="logo-icon">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div class="logo-text">
                    <h1>ALL PROJECT</h1>
                    <p>gay????</p>
                </div>
            </div>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm...">
            </div>
        </div>
    </header>

    <main>
        <div id="statusBanner" class="status-banner hidden">
            <div style="display: flex; align-items: flex-start; gap: 8px;">
                <i class="fa-solid fa-circle-info" style="color: #818cf8; margin-top: 2px;"></i>
                <span id="statusText">Lỗi tải dữ liệu.</span>
            </div>
            <button onclick="dismissBanner()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="section-header">
            <h2 class="section-title">
                <i class="fa-solid fa-fire"></i> Danh sách trò chơi
            </h2>
            <span id="gameCount" class="game-count">0 game</span>
        </div>

        <!-- Grid hiển thị danh sách game -->
        <div id="gameGrid" class="game-grid">
            <!-- Loading Skeletons -->
            <div class="skeleton">
                <div class="skeleton-thumb"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-btn"></div>
            </div>
            <div class="skeleton">
                <div class="skeleton-thumb"></div>
                <div class="skeleton-line"></div>
                <div class="skeleton-line short"></div>
                <div class="skeleton-btn"></div>
            </div>
        </div>

        <!-- Trạng thái trống -->
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">
                <i class="fa-solid fa-ghost"></i>
            </div>
            <p style="font-size: 13px; font-weight: 500; color: #cbd5e1;">Không tìm thấy trò chơi nào</p>
            <p style="font-size: 11px; color: #64748b; margin-top: 4px;">Kiểm tra lại tệp list.json hoặc từ khóa tìm kiếm của bạn.</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 aoc hub.</p>
    </footer>

    <script>
        let allGames = [];

        async function loadGames() {
            try {
                const response = await fetch('list.json');
                if (!response.ok) {
                    throw new Error(`Không thể kết nối file list.json (HTTP ${response.status})`);
                }
                const data = await response.json();
                if (Array.isArray(data)) {
                    allGames = data;
                } else {
                    throw new Error('Cấu trúc file list.json phải là một mảng [...]');
                }
            } catch (error) {
                console.warn('Lỗi:', error.message);
                allGames = [];
                document.getElementById('statusText').textContent = `Lỗi: ${error.message}. (Gợi ý: Hãy chạy qua Local Server như Python http.server để tránh lỗi CORS khi mở file trực tiếp).`;
                document.getElementById('statusBanner').classList.remove('hidden');
            } finally {
                renderGames(allGames);
            }
        }

        function renderGames(games) {
            const grid = document.getElementById('gameGrid');
            const emptyState = document.getElementById('emptyState');
            const gameCount = document.getElementById('gameCount');

            gameCount.textContent = `${games.length} game`;

            if (games.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.add('show');
                return;
            }

            emptyState.classList.remove('show');
            grid.innerHTML = games.map(game => {
                let gameUrl = game.link || '#';
                if (gameUrl && !gameUrl.startsWith('http://') && !gameUrl.startsWith('https://') && gameUrl !== '#') {
                    gameUrl = 'https://' + gameUrl;
                }

                return `
                    <div class="game-card">
                        <div>
                            <div class="game-thumb">
                                <img src="${escapeHtml(game.icon || '')}" 
                                     alt="${escapeHtml(game.name || 'Game')}" 
                                     onerror="this.src='https://placehold.co/400x300/1e293b/94a3b8?text=No+Image'">
                            </div>
                            <h3 class="game-name">${escapeHtml(game.name || 'Trò chơi')}</h3>
                            <p class="game-desc">${escapeHtml(game.describe || 'Không có mô tả')}</p>
                        </div>
                        <a href="${gameUrl}" target="_blank" rel="noopener noreferrer" class="game-btn">
                            <i class="fa-solid fa-play" style="font-size: 10px;"></i> Chơi ngay
                        </a>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function dismissBanner() {
            document.getElementById('statusBanner').classList.add('hidden');
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            const filtered = allGames.filter(game => 
                (game.name && game.name.toLowerCase().includes(query)) ||
                (game.describe && game.describe.toLowerCase().includes(query))
            );
            renderGames(filtered);
        });

        window.onload = () => {
            loadGames();
        };
    </script>
</body>
</html>
